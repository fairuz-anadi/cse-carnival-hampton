services:
  - type: web
    name: campusos
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    port: 3000
    autoDeploy: true
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/campusos.db
      - key: LLM_PROVIDER
        fromGroup: campusos-secrets
      - key: GOOGLE_API_KEY
        fromGroup: campusos-secrets
      - key: OPENAI_API_KEY
        fromGroup: campusos-secrets
      - key: GROQ_API_KEY
        fromGroup: campusos-secrets
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

envGroups:
  - name: campusos-secrets
    envVars:
      - key: GOOGLE_API_KEY
        value: ""  # Add your key via Render dashboard
      - key: OPENAI_API_KEY
        value: ""
      - key: GROQ_API_KEY
        value: ""
      - key: LLM_PROVIDER
        value: groq  # Change based on which key you're using
